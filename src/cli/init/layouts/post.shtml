<extend template="base.shtml">
<head id="head">
</head>
<body id="body">
	<article class="read">
		<p class="where"><a href="$site.page('blog').link()">博客</a></p>
		<h1 :text="$page.title"></h1>
		<time class="when" :text="$page.date.format('2006-01-02')"></time>
		<div class="prose" :html="$page.content()"></div>
		<nav class="turn">
			<div :if="$page.prevPage?()">
				<a href="$if.link()">
					<span>上一篇</span>
					<strong :text="$if.title"></strong>
				</a>
			</div>
			<div :if="$page.nextPage?()">
				<a href="$if.link()">
					<span>下一篇</span>
					<strong :text="$if.title"></strong>
				</a>
			</div>
		</nav>
	</article>
</body>
