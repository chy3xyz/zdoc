<extend template="base.shtml">
<head id="head">
</head>
<body id="body">
	<article class="read">
		<h1 :text="$page.title"></h1>
		<div class="prose" :html="$page.content()"></div>
		<div class="note-list" :loop="$page.subpages()">
			<a href="$loop.it.link()">
				<time :text="$loop.it.date.format('2006-01-02')"></time>
				<strong :text="$loop.it.title"></strong>
			</a>
		</div>
		<p class="feed"><a href="$page.alternative('rss').link()">订阅</a></p>
	</article>
</body>
